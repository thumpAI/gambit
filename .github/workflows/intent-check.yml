name: Intent Checks

on:
  push:
    branches:
      - proposal/maris-orchestrated-runner
      - main
  pull_request:

jobs:
  intent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run intent invariant checks
        run: deno task check:intent

      - name: Validate fixture payload directly
        run: deno task validate:intent scripts/fixtures/final_status.done.valid.json

      - name: Validate emitter helper behavior
        run: deno test -A scripts/emit_final_status.test.ts

      - name: Test status report generator
        run: deno test -A scripts/intent_status_report.test.ts

      - name: Test PR packet generator
        run: deno test -A scripts/generate_intent_pr_packet.test.ts

      - name: Generate intent PR packet preview
        run: deno task packet:intent > intent-pr-packet.generated.md

      - name: Check generated packet freshness
        run: deno run -A scripts/check_intent_packet_fresh.ts

      - name: Upload intent packet artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-pr-packet
          path: intent-pr-packet.generated.md
